# Must match an existing SonarQube project when using a project analysis token (sqp_*).
sonar.projectKey=AACT
sonar.projectName=AACT
sonar.sources=apps/api/app,apps/web/src
sonar.tests=apps/api/tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/vendor/**,**/node_modules/**,**/.next/**,**/bootstrap/cache/**,**/*.ico,**/*.svg
sonar.php.coverage.reportPaths=apps/api/coverage/clover.xml
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info
