name: aact

# Secrets must be set in `.env` (see `.env.example`). No password defaults here.
x-api-env: &api-env
  APP_NAME: AACT
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:${HTTP_PORT:-18080}
  APP_KEY: ${APP_KEY}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-aact}
  DB_USERNAME: ${DB_USERNAME:-aact}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  # Host-only cookies (no Domain=). Domain=localhost breaks sessions on 127.0.0.1.
  SESSION_DOMAIN: ""
  SESSION_SECURE_COOKIE: "false"
  SANCTUM_STATEFUL_DOMAINS: localhost,localhost:${HTTP_PORT:-18080},127.0.0.1,127.0.0.1:${HTTP_PORT:-18080}
  MAIL_MAILER: smtp
  MAIL_HOST: localfakemail-smtp
  MAIL_PORT: 1025
  MAIL_USERNAME: ${MAIL_USERNAME:-lfm_aact_localdev}
  MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env}
  MAIL_FROM_ADDRESS: noreply@aact.local
  MAIL_FROM_NAME: AACT
  FILESYSTEM_DISK: local
  HASH_DRIVER: argon2id
  AACT_ADMIN_TOTP_REQUIRED: ${AACT_ADMIN_TOTP_REQUIRED:-false}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  PRIVATE_DOCUMENTS_DRIVER: ${PRIVATE_DOCUMENTS_DRIVER:-local}
  PRIVATE_DOCUMENTS_PREFIX: ${PRIVATE_DOCUMENTS_PREFIX:-referrers-docs}
  AACT_PRIVATE_DOCUMENT_ENCRYPTION_KEY: ${AACT_PRIVATE_DOCUMENT_ENCRYPTION_KEY:?set AACT_PRIVATE_DOCUMENT_ENCRYPTION_KEY in .env}


services:
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - aact

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: app-dev
    environment:
      <<: *api-env
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      localfakemail-smtp:
        condition: service_started
    networks:
      - aact
    healthcheck:
      # Avoid $ in the script — Compose treats $ as interpolation
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@fsockopen('127.0.0.1',9000)?0:1);",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  queue:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: app-dev
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]
    environment:
      <<: *api-env
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - aact
    stop_grace_period: 30s
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: app-dev
    command: ["sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    environment:
      <<: *api-env
    volumes:
      - ./apps/api:/var/www/html
    depends_on:
      api:
        condition: service_started
    networks:
      - aact
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: web-dev
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    networks:
      - aact
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  mariadb:
    image: mariadb:11.4.5
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aact}
      MYSQL_USER: ${DB_USERNAME:-aact}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - aact
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
      ]
    volumes:
      - redis_data:/data
    networks:
      - aact
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # localfakemail — pinned commit (update deliberately; do not float on main)
  # https://github.com/neverundo/localfakemail/commit/a0c0d7d5d8294e4c896e56ce4ec40b299bac4360
  localfakemail-db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: ${LOCALFAKEMAIL_DB_USER:-localfakemail}
      POSTGRES_PASSWORD: ${LOCALFAKEMAIL_DB_PASSWORD:?set LOCALFAKEMAIL_DB_PASSWORD in .env}
      POSTGRES_DB: ${LOCALFAKEMAIL_DB_NAME:-localfakemail}
    volumes:
      - localfakemail_pgdata:/var/lib/postgresql/data
    networks:
      - aact
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOCALFAKEMAIL_DB_USER:-localfakemail} -d ${LOCALFAKEMAIL_DB_NAME:-localfakemail}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  localfakemail-smtp:
    build:
      context: https://github.com/neverundo/localfakemail.git#a0c0d7d5d8294e4c896e56ce4ec40b299bac4360:apps/smtp
    depends_on:
      localfakemail-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LOCALFAKEMAIL_DB_USER:-localfakemail}:${LOCALFAKEMAIL_DB_PASSWORD:?set LOCALFAKEMAIL_DB_PASSWORD in .env}@localfakemail-db:5432/${LOCALFAKEMAIL_DB_NAME:-localfakemail}
      SMTP_PORT: 1025
      EMAIL_RETENTION_LIMIT: ${EMAIL_RETENTION_LIMIT:-500}
    networks:
      - aact
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(1025,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  localfakemail-web:
    build:
      context: https://github.com/neverundo/localfakemail.git#a0c0d7d5d8294e4c896e56ce4ec40b299bac4360:apps/web
    depends_on:
      localfakemail-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${LOCALFAKEMAIL_DB_USER:-localfakemail}:${LOCALFAKEMAIL_DB_PASSWORD:?set LOCALFAKEMAIL_DB_PASSWORD in .env}@localfakemail-db:5432/${LOCALFAKEMAIL_DB_NAME:-localfakemail}
      EMAIL_RETENTION_LIMIT: ${EMAIL_RETENTION_LIMIT:-500}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${LOCALFAKEMAIL_UI_PORT:-18025}:3000"
    networks:
      - aact
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  localfakemail-seed:
    image: postgres:16.8-alpine
    depends_on:
      localfakemail-web:
        condition: service_healthy
    environment:
      PGHOST: localfakemail-db
      PGUSER: ${LOCALFAKEMAIL_DB_USER:-localfakemail}
      PGPASSWORD: ${LOCALFAKEMAIL_DB_PASSWORD:?set LOCALFAKEMAIL_DB_PASSWORD in .env}
      PGDATABASE: ${LOCALFAKEMAIL_DB_NAME:-localfakemail}
    volumes:
      - ./infra/localfakemail/seed-dev-credential.sql:/seed.sql:ro
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed.sql"]
    networks:
      - aact
    restart: "no"

  clamav:
    image: clamav/clamav:1.4.6
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - aact
    profiles: ["antivirus"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 120s

  sonarqube:
    image: sonarqube:25.5.0.107428-community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in .env}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ports:
      - "${SONAR_PORT:-9000}:9000"
    networks:
      - aact
    profiles: ["sonar"]

  sonar-db:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in .env}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - aact
    profiles: ["sonar"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  aact:
    driver: bridge

volumes:
  mariadb_data:
  redis_data:
  clamav_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
  localfakemail_pgdata:
  web_node_modules:
